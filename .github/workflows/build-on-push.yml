# Workflow to automatically create deliverables
name: Build on push

on:
  [push, pull_request]

jobs:
  build:
    name: Assembling artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write # Enables creating/updating releases and tags

    steps:
      # Check out into demo/godot-xr-development-kit
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: demo/godot-xr-development-kit
          submodules: recursive

      # Assemble the plugin folder and clean up the demo folder
      - name: Create XR development kit plugin
        run: |
          mkdir plugin
          mkdir plugin/godot-xr-development-kit
          mkdir plugin/godot-xr-development-kit/addons
          cp -r demo/godot-xr-development-kit/addons/godot-xr-development-kit plugin/godot-xr-development-kit/addons
          cp plugin/godot-xr-development-kit/addons/godot-xr-development-kit/CONTRIBUTORS.md demo/godot-xr-development-kit

      # Remove folders we don't want to include in the releases
      - name: Cleanup
        run: |
          rm -rf demo/godot-xr-development-kit/.git
          rm -rf demo/godot-xr-development-kit/.github
          rm -rf plugin/godot-xr-development-kit/.git
          rm -rf plugin/godot-xr-development-kit/.github

      # Upload plugin
      - name: Create XR development kit library artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-xr-development-kit
          path: |
            plugin

      # Upload demo
      - name: Create XR development kit demo artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-xr-development-kit-demo
          path: |
            demo

      # For tagged builds create the artifact zips
      - name: Zip asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        run: |
          cd plugin
          zip -qq -r ../godot-xr-development-kit.zip godot-xr-development-kit
          cd ../demo
          zip -qq -r ../godot-xr-development-kit-demo.zip godot-xr-development-kit
          cd ..

      # For tagged builds create the release
      - name: Create and upload asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          artifacts: "godot-xr-development-kit.zip,godot-xr-development-kit-demo.zip"
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
